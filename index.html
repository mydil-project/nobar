<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOBAR - Nonton</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= LOGIN SCREEN ================= -->
<div id="loginScreen" class="login-screen">

    <div class="login-card">

        <div class="logo login-logo">
            <span class="logo-icon">▶</span>
            <span>NOBAR</span>
        </div>

        <p class="login-subtitle">
            Nonton online bareng teman-temanmu
        </p>

        <button id="btnGoogleLogin" class="btn-google" type="button">

            <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>

            Masuk dengan Google

        </button>

        <div id="loginError" class="login-error"></div>

    </div>

</div>


<!-- ================= USER PAGE ================= -->
<div id="userPage" class="app hidden">

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            <span class="logo-icon">▶</span>
            <span>NOBAR</span>
        </div>

        <div class="header-right">

            <div class="viewer-count">
                <span>👥</span>
                <span><span id="userViewerCountTop">0</span> Viewer</span>
            </div>

            <div class="profile">
                <img id="userPhoto" src="https://i.pravatar.cc/100?img=12" alt="Profile">
                <span id="userName">Penonton</span>
            </div>

            <button id="btnLogout" class="btn-logout" type="button">Keluar</button>

        </div>

    </header>


    <!-- MAIN -->
    <main class="main">

        <!-- LEFT -->
        <section class="left-content">

            <!-- VIDEO (tanpa kontrol) -->
            <div class="video-section">

                <div class="video-frame" id="userPlayer">

                    <video id="userVideoPlayer" playsinline preload="metadata"></video>

                    <iframe
                        id="userYoutubeFrame"
                        class="youtube-frame"
                        src="about:blank"
                        title="Video Player"
                        allow="autoplay; encrypted-media; picture-in-picture"
                        allowfullscreen>
                    </iframe>

                    <div id="userNoVideo" class="video-placeholder">
                        <div class="play-big">▶</div>
                    </div>

                    <div id="userPlayOverlay" class="autoplay-overlay hidden">
                        <div class="play-big">▶</div>
                        <span>Klik untuk memutar</span>
                    </div>

                </div>


                <!-- MOVIE INFO BAR -->
                <div class="movie-info">

                    <div class="now-playing">
                        <span class="status-dot"></span>
                        <span class="info-label">Sekarang</span>
                        <strong id="userNowTitle">Menunggu host...</strong>
                    </div>

                    <span class="info-sep hidden" id="infoSep">|</span>

                    <div id="nextFilmBar" class="next-movie hidden">
                        <span class="info-label">Selanjutnya</span>
                        <strong id="nextFilmBarTitle">-</strong>
                    </div>

                    <span id="nextFilmBarCountdown" class="next-countdown hidden">--:--</span>

                    <div class="info-right">
                        <span id="viewerModeBadge" class="mode-badge sync">● Sync</span>
                        <span>👥 <span id="userViewerCountBar">0</span></span>
                        <button type="button" id="btnUserFullscreen" class="fullscreen-btn" title="Fullscreen">⛶</button>
                    </div>

                </div>

            </div>


            <!-- VIEWERS -->
            <section class="viewers panel-content active">

                <div class="viewer-section-label">Host</div>
                <div id="hostViewerSection" class="host-viewer">-</div>

                <div class="viewer-section-label">Penonton</div>
                <div id="viewerListSection" class="viewer-list"></div>

            </section>

        </section>


        <!-- CHAT -->
        <aside class="chat">

            <div class="chat-header">
                <div class="chat-title">
                    <span>▣</span>
                    <strong>Chat <span id="chatMsgCount" class="chat-msg-count">(0 pesan)</span></strong>
                </div>
                <div class="chat-viewers">👥 <span id="userChatCount">0</span></div>
            </div>

            <div id="chatMessages" class="chat-messages"></div>

            <div class="chat-input">
                <input id="chatInput" type="text" placeholder="Tulis pesan...">
                <button id="btnChatSend" type="button" title="Kirim">➤</button>
            </div>

        </aside>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script type="module" src="index.js?v=focus1"></script>

</body>
</html>
