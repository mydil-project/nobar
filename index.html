<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">

    <title>NOBAR - Nonton</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>

<body>

<!-- ================= USER PAGE ================= -->
<div id="userPage" class="app hidden">

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            <span class="logo-icon">▶</span>
            <span>NOBAR</span>
        </div>

        <div class="header-right">

            <div class="viewer-count">
                <span>👥</span>
                <span><span id="userViewerCountTop">0</span> Viewer</span>
            </div>

            <div class="profile">
                <img id="userPhoto" src="https://i.pravatar.cc/100?img=12" alt="Profile">
                <span id="userName">Penonton</span>
            </div>

            <button id="btnLogout" class="btn-logout" type="button">Keluar</button>

        </div>

    </header>


    <!-- MAIN -->
    <main class="main">

        <!-- LEFT -->
        <section class="left-content">

            <!-- VIDEO (tanpa kontrol) -->
            <div class="video-section">

                <div class="video-frame" id="userPlayer">

                    <video id="userVideoPlayer" playsinline preload="metadata"></video>

                    <iframe
                        id="userYoutubeFrame"
                        class="youtube-frame"
                        src="about:blank"
                        title="Video Player"
                        allow="autoplay; encrypted-media; picture-in-picture"
                        allowfullscreen>
                    </iframe>

                    <div id="userNoVideo" class="video-placeholder">
                        <div class="play-big">▶</div>
                    </div>

                    <div id="userPlayOverlay" class="autoplay-overlay hidden">
                        <div class="play-big">▶</div>
                        <span>Klik untuk memutar</span>
                    </div>

                </div>


                <!-- MOVIE INFO BAR -->
                <div class="movie-info">

                    <div class="now-playing">
                        <span class="status-dot"></span>
                        <span class="info-label">Sekarang</span>
                        <strong id="userNowTitle">Menunggu host...</strong>
                    </div>

                    <span class="info-sep hidden" id="infoSep">|</span>

                    <div id="nextFilmBar" class="next-movie hidden">
                        <span class="info-label">Selanjutnya</span>
                        <strong id="nextFilmBarTitle">-</strong>
                    </div>

                    <span id="nextFilmBarCountdown" class="next-countdown hidden">--:--</span>

                    <div class="info-right">
                        <span id="viewerModeBadge" class="mode-badge sync">● Sync</span>
                        <span>👥 <span id="userViewerCountBar">0</span></span>
                        <button type="button" id="btnUserFullscreen" class="fullscreen-btn" title="Fullscreen">⛶</button>
                    </div>

                </div>

            </div>


            <!-- VIEWERS -->
            <section class="viewers panel-content active">

                <div class="viewer-section-label">Host</div>
                <div id="hostViewerSection" class="host-viewer">-</div>

                <div class="viewer-section-label">Penonton</div>
                <div id="viewerListSection" class="viewer-list"></div>

            </section>

        </section>


        <!-- CHAT -->
        <aside class="chat">

            <div class="chat-header">
                <div class="chat-title">
                    <span>▣</span>
                    <strong>Chat <span id="chatMsgCount" class="chat-msg-count">(0 pesan)</span></strong>
                </div>
                <div class="chat-viewers">👥 <span id="userChatCount">0</span></div>
            </div>

            <div id="chatMessages" class="chat-messages"></div>

            <div class="chat-input">
                <input id="chatInput" type="text" placeholder="Tulis pesan...">
                <button id="btnChatSend" type="button" title="Kirim">➤</button>
            </div>

        </aside>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script type="module" src="js/index.js?v=nobar1"></script>

</body>
</html>
